name: Buscar ofertas Falabella

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: write

concurrency:
  group: falabella-ofertas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar librerías
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Revisar ofertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: INFO
        run: python run_once.py

      - name: Guardar historial
        if: success()
        run: |
          git config user.name "falabella-ofertas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historial de ofertas [skip ci]"
            git pull --rebase
            git push
          fi
